services:
  - type: web
    name: berry-safety-api
    runtime: docker
    plan: free
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        value: https://rwacygoxhkxxxkvushmb.supabase.co
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: MAKE_WEBHOOK_URL
        sync: false
      - key: MAKE_TEST_API_TOKEN
        generateValue: true
      - key: MAKE_TEST_ENABLED
        sync: false
      - key: BERRY_ALLOWED_ORIGINS
        value: https://brycesg96.github.io
