name: Publicar Berry en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Compilar la aplicación
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund
      - name: Verificar la API de prueba de Make
        run: npm run test:api
      - name: Verificar la conservación de archivos para pestañas abiertas
        run: node --test scripts/retain-pages-assets.test.mjs
      - name: Verificar la referencia de numeración transaccional
        run: python3 -m unittest discover -s reference -p 'test_*.py' -v
      - name: Verificar estructura y permisos de Supabase
        run: npm run test:supabase
      - name: Compilar para la ruta de GitHub Pages
        run: npm run build:pages
        env:
          VITE_MAKE_TEST_API_URL: ${{ vars.VITE_MAKE_TEST_API_URL || 'https://berry-safety-api.onrender.com/api/integrations/make/test' }}
          VITE_DEMO_ADMIN_EMAIL: ${{ vars.VITE_DEMO_ADMIN_EMAIL }}
          VITE_DEMO_ADMIN_NAME: ${{ vars.VITE_DEMO_ADMIN_NAME }}
          VITE_DEMO_INSPECTOR_EMAIL: ${{ vars.VITE_DEMO_INSPECTOR_EMAIL }}
          VITE_DEMO_INSPECTOR_NAME: ${{ vars.VITE_DEMO_INSPECTOR_NAME }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Conservar archivos recientes para las pestañas abiertas
        run: node scripts/retain-pages-assets.mjs dist-pages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      - name: Preparar los archivos de publicación
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages
          retention-days: 7

  deploy:
    name: Publicar la web
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
